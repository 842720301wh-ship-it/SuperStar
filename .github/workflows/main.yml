name: 刷课
 
on: 
  push:
    branches: [ main ]
  #是否开始每天8点定时刷课，若要开启请把下面两行注释去掉
  #schedule:
  #  - cron: "0 8 * * *" 
    
jobs: 
  Start:
    runs-on: ubuntu-latest # 在最新版本的 Ubuntu 操作系统环境下运行
    steps: # 要执行的步骤
      - name: 拷贝代码
        uses: actions/checkout@v4  # 用于将github代码仓库的代码拷贝到工作目录中
 
      - name: 设置python环境
        uses: actions/setup-python@v5 # 用于设置 Python 环境，它允许你指定要在工作环境中使用的 Python 版本
        with:
          python-version: '3.13'  # 选择要用的Python版本
 
      - name: 安装依赖包
        run: | # 安装依赖包
          pip install -r ./requirements.txt 
          
      
      - name: 生成配置文件
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
          AI_KEY: ${{ secrets.AI_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          cat > config.ini <<EOF
          [common]
          use_cookies=false
          username=${CHAOXING_USERNAME}
          password=${CHAOXING_PASSWORD}
          course_list=${CHAOXING_COURSE_LIST}
          speed=1
          jobs=1
          notopen_action=retry

          [tiku]
          provider=AI
          check_llm_connection=true
          submit=true
          cover_rate=0.9
          delay=1.0
          endpoint=${AI_ENDPOINT}
          key=${AI_KEY}
          model=${AI_MODEL}
          min_interval_seconds=3
          http_proxy=
          true_list=正确,对,√,是
          false_list=错误,错,×,否,不对,不正确

          [notification]
          provider=
          url=
          EOF

      - name: Run main.py
        run: python main.py -c config.ini
