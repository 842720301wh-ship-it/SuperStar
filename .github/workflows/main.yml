name: 刷课
 #梁
on: 
  push:
    branches: [ main ]
  #是否开始每天8点定时刷课，若要开启请把下面两行注释去掉
  #schedule:
  #  - cron: "0 8 * * *" 
    
jobs: 
  Start:
    runs-on: ubuntu-latest # 在最新版本的 Ubuntu 操作系统环境下运行
    steps: # 要执行的步骤
      - name: 拷贝代码
        uses: actions/checkout@v4  # 用于将github代码仓库的代码拷贝到工作目录中
 
      - name: 设置python环境
        uses: actions/setup-python@v5 # 用于设置 Python 环境，它允许你指定要在工作环境中使用的 Python 版本
        with:
          python-version: '3.13'  # 选择要用的Python版本
 
      - name: 安装依赖包
        run: | # 安装依赖包
          pip install -r ./requirements.txt 
          
      
      - name: Run main.py
        run: |
          cat > config.ini <<'EOF'
          [common]
          ; 手机号账号
          username=13925953781 
          ; 登录密码
          password=lyj201012345xxt 
          ; 课程ID，逗号隔开（必填，留空在Actions里会因等待输入而报错）
          course_list=247370145
          ; 视频播放倍速(1~2)
          speed=1
          ; 同时进行的章节数量（章节并发）
          jobs=1
          ; 遇到关闭任务点时的行为: retry-重试, continue-继续
          notopen_action=retry

          [tiku]
          provider=AI
          ; AI 接口地址（一般需要带 /v1）、Key、模型名称
          endpoint=https://api.longcat.chat/openai/v1
          key=ak_2j642A6CX5Bv9hw6el92R30m9Yr2C
          model=LongCat-2.0
          ; AI 请求最小间隔，单位秒
          min_interval_seconds=3
          http_proxy=
          ; 是否启动时检查AI连接
          check_llm_connection=true
          ; 是否自动提交答题: true-达到覆盖率后提交, false-只保存不提交
          submit=true
          ; 最低题库覆盖率，达到才提交
          cover_rate=0.9
          ; 搜索多个题目的间隔，单位秒
          delay=1.0
          true_list=正确,对,√,是
          false_list=错误,错,×,否,不对,不正确
          EOF
          python main.py -c config.ini
